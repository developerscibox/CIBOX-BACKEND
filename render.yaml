# Render Blueprint — backend de Cibox (Express + MongoDB Atlas)
# Importar en Render: New → Blueprint → conectar este repo. Los secretos
# (sync:false) se cargan a mano en el dashboard de Render tras crear el servicio.
services:
  - type: web
    name: cibox-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # PORT lo inyecta Render automáticamente; el backend lo lee de process.env.PORT
      - key: WEBPAY_ENV
        value: integration
      - key: SII_ENABLED
        value: "false"
      # ── Secretos: cargar en el dashboard (no se versionan) ──
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GUEST_ID_SECRET
        sync: false
      # ── URLs públicas: setear con los dominios reales de Vercel ──
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
